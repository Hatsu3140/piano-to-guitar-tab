<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piano to Guitar TAB</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <h1>Piano to Guitar TAB</h1>
    <p class="lead">ピアノ譜（MusicXML）から、ソロギター用 TAB 譜（Guitar Pro 形式）の下書きを作ります。</p>

    <form id="upload-form" class="card">
        <label for="file-input" class="label">MusicXML ファイル（.musicxml / .xml / .mxl）</label>
        <!-- ファイルはここへドラッグ＆ドロップしても選べる -->
        <div id="drop-zone" class="drop-zone">
            <input id="file-input" name="file" type="file" accept=".musicxml,.xml,.mxl" required>
            <p class="drop-hint">またはファイルをここへドラッグ＆ドロップ</p>
        </div>

        <!-- ファイルを選ぶと、曲に合うチューニングとカポを調べて表示する -->
        <section id="suggestions" class="suggestions" hidden>
            <p class="label">おすすめのチューニングとカポ</p>
            <p id="suggestion-status" class="suggestion-status"></p>
            <ol id="suggestion-list" class="suggestion-list"></ol>
        </section>

        <div class="settings">
            <label for="tuning" class="label">チューニング</label>
            <select id="tuning" name="tuning">
                <option value="STANDARD" selected>レギュラー（EADGBE）</option>
                <option value="DROP_D">ドロップD（DADGBE）</option>
                <option value="DADGAD">DADGAD</option>
                <option value="OPEN_D">オープンD（DADF#AD）</option>
                <option value="OPEN_G">オープンG（DGDGBD）</option>
                <option value="CGDGBD">CGDGBD</option>
            </select>

            <label for="capo" class="label">カポ</label>
            <select id="capo" name="capo">
                <option value="0" selected>なし</option>
                <option value="1">1フレット</option>
                <option value="2">2フレット</option>
                <option value="3">3フレット</option>
                <option value="4">4フレット</option>
                <option value="5">5フレット</option>
                <option value="6">6フレット</option>
                <option value="7">7フレット</option>
            </select>

            <label for="transpose" class="label">移調（半音）</label>
            <input id="transpose" name="transpose" type="number" min="-12" max="12" step="1" value="0">

            <span class="label">奏法</span>
            <div class="checks">
                <label><input id="barre" type="checkbox" checked> セーハを使う</label>
                <label><input id="strokes" type="checkbox" checked> ストロークを入れる</label>
            </div>
        </div>

        <button id="submit-button" type="submit">変換する</button>
    </form>

    <p id="status" class="status" role="status"></p>
    <ul id="report" class="report"></ul>

    <!-- 変換結果の TAB 譜。画面で見て、音を聴いて、よければダウンロードする -->
    <section id="result" class="result" hidden>
        <div class="player-controls">
            <button id="play-button" type="button" disabled>再生</button>
            <button id="stop-button" type="button" class="secondary" disabled>止める</button>
            <button id="download-button" type="button" class="secondary">.gp5 をダウンロード</button>
            <span id="player-status" class="player-status"></span>
        </div>
        <div id="tab-view" class="tab-view"></div>
    </section>

    <p class="note">細かい調整は TuxGuitar などのソフトで行ってください。</p>
</main>
<!-- TAB 譜の表示と再生には alphaTab（https://alphatab.net 、MPL-2.0）を使う -->
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
