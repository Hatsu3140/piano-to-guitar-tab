<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piano to Guitar TAB</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <h1>Piano to Guitar TAB</h1>
    <p class="lead">ピアノ譜（MusicXML）から、ソロギター用 TAB 譜（Guitar Pro 形式）の下書きを作ります。</p>

    <form id="upload-form" class="card">
        <label for="file-input" class="label">MusicXML ファイル（.musicxml / .xml / .mxl）</label>
        <input id="file-input" name="file" type="file" accept=".musicxml,.xml,.mxl" required>
        <button id="submit-button" type="submit">変換する</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <p class="note">細かい調整は TuxGuitar などのソフトで行ってください。</p>
</main>
<script src="js/app.js"></script>
</body>
</html>
