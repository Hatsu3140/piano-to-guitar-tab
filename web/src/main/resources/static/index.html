<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piano to Guitar TAB</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <h1>Piano to Guitar TAB</h1>
    <p class="lead">ピアノ譜（MusicXML）から、ソロギター用 TAB 譜（Guitar Pro 形式）の下書きを作ります。</p>

    <form id="upload-form" class="card">
        <label for="file-input" class="label">MusicXML ファイル（.musicxml / .xml / .mxl）</label>
        <input id="file-input" name="file" type="file" accept=".musicxml,.xml,.mxl" required>

        <div class="settings">
            <label for="difficulty" class="label">難易度</label>
            <select id="difficulty" name="difficulty">
                <option value="INTRODUCTORY">入門（メロディだけ・0〜5フレット）</option>
                <option value="BEGINNER">初級（メロディ＋小節頭のベース・ふだん2音・0〜5フレット）</option>
                <option value="INTERMEDIATE" selected>中級（メロディ＋拍頭のベース＋和音・3音まで・0〜7フレット）</option>
                <option value="ADVANCED">上級（メロディ＋ベース＋和音・5音まで・0〜15フレット）</option>
            </select>

            <label for="tuning" class="label">チューニング</label>
            <select id="tuning" name="tuning">
                <option value="STANDARD" selected>レギュラー（EADGBE）</option>
                <option value="DROP_D">ドロップD（DADGBE）</option>
            </select>

            <label for="capo" class="label">カポ</label>
            <select id="capo" name="capo">
                <option value="0" selected>なし</option>
                <option value="1">1フレット</option>
                <option value="2">2フレット</option>
                <option value="3">3フレット</option>
                <option value="4">4フレット</option>
                <option value="5">5フレット</option>
                <option value="6">6フレット</option>
                <option value="7">7フレット</option>
            </select>

            <label for="transpose" class="label">移調（半音）</label>
            <input id="transpose" name="transpose" type="number" min="-12" max="12" step="1" value="0">

            <span class="label">奏法</span>
            <div class="checks">
                <label><input id="barre" type="checkbox" checked> セーハを使う</label>
                <label><input id="strokes" type="checkbox" checked> ストロークを入れる</label>
            </div>
        </div>

        <button id="submit-button" type="submit">変換する</button>
    </form>

    <p id="status" class="status" role="status"></p>
    <ul id="report" class="report"></ul>

    <p class="note">細かい調整は TuxGuitar などのソフトで行ってください。</p>
</main>
<script src="js/app.js"></script>
</body>
</html>
